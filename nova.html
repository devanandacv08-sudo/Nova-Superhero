<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA — Your AI Superhero</title>

    <link rel="stylesheet" href="nova.css">

</head>

<body>

    <!-- Galaxy Background -->

    <div class="galaxy"></div>
    <div class="stars"></div>


    <!-- Navigation -->

    <header>

        <div class="logo">
            NOVA
        </div>

        <div class="tagline">
            THE UNLIMITED YOU
        </div>

    </header>


    <!-- Main -->

    <main>

        <p class="welcome">
            ✦ WELCOME TO NOVA ✦
        </p>

        <h1>
            WHAT DO YOU<br>
            WANT TO DO?
        </h1>

        <p class="subtitle">
            Your ideas. Your questions. Your journey.
            <br>
            NOVA is here to power them.
        </p>


        <!-- Powers -->

        <div class="powers">

            <button>
                <span>🧠</span>
                <strong>THINK</strong>
                <small>Make decisions & solve problems</small>
            </button>


            <button>
                <span>📚</span>
                <strong>LEARN</strong>
                <small>Understand anything, simply</small>
            </button>


            <button>
                <span>💡</span>
                <strong>CREATE</strong>
                <small>Turn ideas into possibilities</small>
            </button>


            <button>
                <span>🛠️</span>
                <strong>BUILD</strong>
                <small>Create projects & experiences</small>
            </button>


            <button class="talk">
                <span>✦</span>
                <strong>TALK TO NOVA</strong>
                <small>Your AI companion</small>
            </button>

        </div>

    </main>


    <script src="nova.js"></script>

</body>

</html>
